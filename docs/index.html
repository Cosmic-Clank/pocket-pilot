<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Pilot Legal</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --brand: #155DFC;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px 56px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 6px 24px rgba(17, 24, 39, 0.05);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            color: var(--brand);
            line-height: 1.2;
        }

        p {
            color: var(--muted);
            margin: 0 0 22px;
        }

        .links {
            display: grid;
            gap: 12px;
        }

        a {
            display: block;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            background: #fff;
        }

        a:hover {
            border-color: var(--brand);
            color: var(--brand);
        }
    </style>
</head>

<body>
    <main class="wrap">
        <article class="card">
            <h1>Pocket Pilot Legal</h1>
            <p>Legal documents for Pocket Pilot app store listing and public reference.</p>

            <div class="links">
                <a href="./privacypolicy.html">Privacy Policy</a>
                <a href="./terms.html">Terms of Service</a>
            </div>
        </article>
    </main>
</body>

</html>
